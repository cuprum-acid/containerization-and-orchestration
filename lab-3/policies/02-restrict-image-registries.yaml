# Images only from trusted registries: our own (shop.local) and the
# CloudNativePG one for Postgres.
#
# Why: an image from an arbitrary registry is unreviewed code running in the
# cluster - a typo-squatted name or a hijacked public image is enough. A short
# allowlist makes "what can run here" an explicit decision.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: restrict-image-registries
spec:
  validationActions: [Deny]
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: [kube-system, kube-public, kube-node-lease, kyverno, monitoring, cnpg-system]
  variables:
    - name: containers
      expression: >-
        object.spec.containers +
        (has(object.spec.initContainers) ? object.spec.initContainers : [])
    # The trailing slash matters: "shop.local.evil.com/x" must not pass.
    - name: allowed
      expression: "['shop.local/', 'ghcr.io/cloudnative-pg/']"
  validations:
    - expression: >-
        variables.containers.all(c,
          variables.allowed.exists(prefix, c.image.startsWith(prefix)))
      messageExpression: >-
        'images must come from ' + variables.allowed.join(', ') + '; got: ' +
        variables.containers.filter(c,
          !variables.allowed.exists(p, c.image.startsWith(p))).map(c, c.image).join(', ')
