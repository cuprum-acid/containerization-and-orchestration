# In production namespaces (env: prod) every image needs a fixed version:
# an explicit tag other than :latest, or a digest.
#
# Why: :latest (or no tag, which means the same) is not a version. Two pods
# of one Deployment can run different code depending on when their node
# pulled, a restart silently upgrades, and `helm rollback` cannot go back to
# "the previous latest". Outside prod it is tolerable, so this policy is
# scoped by the namespace label instead of the opt-out list.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-latest-tag-in-prod
spec:
  validationActions: [Deny]
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
    namespaceSelector:
      matchLabels:
        env: prod
  variables:
    - name: containers
      expression: >-
        object.spec.containers +
        (has(object.spec.initContainers) ? object.spec.initContainers : [])
  validations:
    # A tag is a ":" after the last "/" (so a registry port like
    # host:5000/img does not count as one); a digest is "@sha256:".
    - expression: >-
        variables.containers.all(c,
          c.image.contains('@sha256:') ||
          (c.image.matches(':[^/]+$') && !c.image.endsWith(':latest')))
      message: "in env=prod images need a fixed tag (not :latest) or a digest"
