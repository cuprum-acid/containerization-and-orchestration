{{- $c := dict "root" $ "component" "worker" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-worker
  labels:
    {{- include "shop.labels" $c | nindent 4 }}
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      {{- include "shop.selectorLabels" $c | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  progressDeadlineSeconds: 120
  template:
    metadata:
      labels:
        {{- include "shop.labels" $c | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
      terminationGracePeriodSeconds: 30
      containers:
        - name: worker
          image: "{{ .Values.registry }}/{{ .Values.worker.image.repository }}:{{ .Values.worker.image.tag }}"
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: HEALTH_FAIL
              value: {{ .Values.worker.healthFail | quote }}
            - name: BATCH
              value: {{ .Values.worker.batch | quote }}
            - name: INTERVAL
              value: {{ .Values.worker.interval | quote }}
            {{- include "shop.databaseEnv" . | nindent 12 }}
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          securityContext:
            {{- include "shop.containerSecurityContext" . | nindent 12 }}
---
# The worker serves no users; the Service exists so Prometheus can find its
# /metrics (part 5).
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-worker
  labels:
    {{- include "shop.labels" $c | nindent 4 }}
spec:
  selector:
    {{- include "shop.selectorLabels" $c | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
