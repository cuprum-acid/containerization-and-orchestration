{{- $c := dict "root" $ "component" "api" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
  labels:
    {{- include "shop.labels" $c | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      {{- include "shop.selectorLabels" $c | nindent 6 }}
  # One pod at a time and never below the desired count: a new pod must pass
  # readiness before an old one is taken away. A broken release therefore
  # stalls with all old pods still serving.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  # Report a stalled rollout after 2 minutes instead of the default 10.
  progressDeadlineSeconds: 120
  template:
    metadata:
      labels:
        {{- include "shop.labels" $c | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
      # The pod is removed from the Service endpoints and receives SIGTERM at
      # the same time; preStop below gives the endpoint removal time to reach
      # every kube-proxy before the server stops accepting connections.
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: "{{ .Values.registry }}/{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: HEALTH_FAIL
              value: {{ .Values.api.healthFail | quote }}
            {{- include "shop.databaseEnv" . | nindent 12 }}
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 2
            failureThreshold: 2
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          lifecycle:
            # The image is FROM scratch - there is no `sleep` binary to exec.
            # The built-in sleep action needs none.
            preStop:
              sleep:
                seconds: 5
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext:
            {{- include "shop.containerSecurityContext" . | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-api
  labels:
    {{- include "shop.labels" $c | nindent 4 }}
spec:
  selector:
    {{- include "shop.selectorLabels" $c | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
