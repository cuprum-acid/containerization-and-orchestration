# An HTTP echo server as the Alertmanager webhook: every notification is
# logged as one JSON line with the full payload, so it shows up in
# `kubectl logs` and in Loki.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "alert-receiver.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "alert-receiver.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "alert-receiver.labels" . | nindent 8 }}
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: receiver
          image: mendhak/http-https-echo:{{ .Chart.AppVersion }}
          env:
            - name: HTTP_PORT
              value: "8080"
            # One line per request instead of pretty-printed JSON.
            - name: LOG_WITHOUT_NEWLINE
              value: "true"
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "alert-receiver.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "alert-receiver.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
