# Secrets come from the host environment at `docker compose up` time and are
# mounted into the containers as files under /run/secrets. Nothing secret is
# written to this repo, to an .env file or to `docker inspect`.
#
#   export CLAUDE_TOKEN=$(security find-generic-password -s lab8-claude-token -w)
#   export GITHUB_TOKEN_RO=$(security find-generic-password -s lab8-github-ro -w)
#   export N8N_KEY=$(security find-generic-password -s lab8-n8n-key -w)
#   export GRAFANA_ADMIN=$(security find-generic-password -s lab8-grafana-admin -w)
#   docker compose up -d --build

name: release-notes

services:
  agent:
    build: ./agent
    secrets: [claude_token, github_token_ro]
    volumes:
      - agent-repo:/work
    environment:
      AGENT_MODEL: haiku
      AGENT_TIMEOUT_SECONDS: "300"
    # No ports: only n8n (and Prometheus later) talk to it, over the
    # compose network.
    expose: ["8080"]

  # Workflows, executions and credentials live in the volume; credentials
  # are encrypted with the key, which lives only in the Keychain. The UI is
  # bound to loopback: this n8n holds a token that can write to the repo.
  n8n:
    image: n8nio/n8n:2.45.6
    secrets: [n8n_key]
    environment:
      N8N_ENCRYPTION_KEY_FILE: /run/secrets/n8n_key
      # One production run at a time: the schedule fires every minute and an
      # agent run takes several. A second run would see the same last
      # release and try to publish the same version.
      N8N_CONCURRENCY_PRODUCTION_LIMIT: "1"
      # /metrics for Prometheus; the event bus adds counters of finished and
      # failed workflow runs.
      N8N_METRICS: "true"
      N8N_METRICS_INCLUDE_MESSAGE_EVENT_BUS_METRICS: "true"
    volumes:
      - n8n-data:/home/node/.n8n
      - ./workflows:/workflows
    ports: ["127.0.0.1:5678:5678"]

  prometheus:
    image: prom/prometheus:v3.15.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # Rare events: a week of history, so a release from Monday is still
      # on the dashboard on Friday.
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/rules.yml:/etc/prometheus/rules.yml:ro
      - prometheus-data:/prometheus
    ports: ["127.0.0.1:9090:9090"]

  grafana:
    image: grafana/grafana:13.3.0
    secrets: [grafana_admin]
    environment:
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin
      # Read-only view without logging in; editing needs the admin password.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/release-pipeline.json
    volumes:
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports: ["127.0.0.1:3000:3000"]

secrets:
  claude_token:
    environment: CLAUDE_TOKEN
  github_token_ro:
    environment: GITHUB_TOKEN_RO
  n8n_key:
    environment: N8N_KEY
  grafana_admin:
    environment: GRAFANA_ADMIN

volumes:
  agent-repo:
  n8n-data:
  prometheus-data:
  grafana-data:
